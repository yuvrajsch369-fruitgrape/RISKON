function pickOwnerForRole(facilityId, role){
  var match = DATA.employees.find(function(e){ return e.facility_id===facilityId && e.role===role; });
  if(match) return match.employee_id;
  var any = DATA.employees.find(function(e){ return e.role===role; });
  return any ? any.employee_id : 'EMP-0002';
}

/* ---- Continuous Learning: human feedback on a recommendation (section 2 of
   the spec). GOVERNANCE GUARDRAIL: a role without approval authority cannot
   record a decision even by firing this handler directly, and the blocked
   attempt is itself audit-logged -- same pattern as handleApproval() above.
   This never auto-creates a corrective action, never auto-changes a risk
   rating, and never touches ai_versions/learning_candidates -- it only
   records the human's decision on this one recommendation. ---- */
function handleRecommendationFeedback(recId, decision){
  var r = lrecById(recId);
  if(!r) return;
  var role = currentRole();
  if(!role.canApprove){
    logAudit({ action:'Unauthorized action attempted', entity_type:'Recommendation', entity_id:recId,
      previous_value:{human_decision:r.human_decision}, new_value:null,
      reason:role.label+' role does not have approval authority; action blocked by client-side RBAC check.',
      source:'Human-generated', approval_status:'N/A' });
    alert('Your role ('+role.label+') does not have approval authority for AI recommendations.\nSwitch to HSE Manager or Plant Manager.');
    render();
    return;
  }
  var reasonEl = document.getElementById('lf_reason_'+recId);
  var text = reasonEl ? reasonEl.value.trim() : '';
  if(decision !== 'Approved' && !text){
    alert('Please enter a reason'+(decision==='Modified'?' describing the modification':'')+' before submitting.');
    return;
  }

  var prevDecision = r.human_decision;
  r.human_decision = decision;
  r.human_modification_text = decision==='Modified' ? text : null;
  r.decision_reason = decision==='Modified' ? (text ? 'See modification text.' : null) : (text || null);
  r.decision_by_employee_id = null;  // this demo session isn't a seeded employee row
  r.decision_date = '2026-09-03';
  r.updated_at = '2026-09-03';
  r.learning_signal = decision==='Modified' ? 'Modification' : 'Not Yet Determined';
  r.evaluation_status = 'Not Evaluated';

  logAudit({ action:'Recommendation reviewed', entity_type:'Recommendation', entity_id:recId,
    previous_value:{human_decision:prevDecision}, new_value:{human_decision:decision, modification:r.human_modification_text},
    reason: text || 'No reason recorded.', source:'Human-generated',
    approval_status: (decision==='Approved'||decision==='Rejected') ? decision : 'N/A' });

  // Best-effort real persistence -- the local mutation above already updated
  // the UI, so a failure here (backend unreachable) doesn't break anything;
  // it just means this decision lives only in this browser session, same as
  // every other write in RISKON when no backend is running.
  if(BACKEND_REACHABLE){
    fetch('/api/recommendations/'+recId+'/decision', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ decision:decision, reason:(decision!=='Modified'?text:null) || null,
        modification_text:(decision==='Modified'?text:null) })
    }).catch(function(){ /* local state already reflects the decision either way */ });
  }

  App.lastLearningFeedbackId = recId;
  render();
}

document.addEventListener('click', function(e){
  // Any click on a nav link should close the mobile drawer -- including a
  // click on the CURRENT page's own link, which fires no 'hashchange' event
  // for the hashchange-based close below to catch, so this must render
  // itself rather than rely on that listener.
  if(App.mobileNavOpen && e.target.closest('.rail-link')){ App.mobileNavOpen = false; render(); }
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.dataset.action;

  if(action==='toggleMobileNav'){ App.mobileNavOpen = !App.mobileNavOpen; render(); return; }
  if(action==='closeMobileNav'){ App.mobileNavOpen = false; render(); return; }

  if(action==='goInvestigation'){ if(!t.dataset.id) return; App.selectedIncidentId = t.dataset.id; navigate('investigation'); e.preventDefault(); return; }
  if(action==='selectIncident'){ App.selectedIncidentId = t.dataset.id; render(); return; }
  if(action==='toggleNewIncident'){ App.newIncidentOpen = !App.newIncidentOpen; render(); return; }
  if(action==='submitIncident'){ submitNewIncident(); return; }
  if(action==='approveIncident'){ handleApproval(t.dataset.id,'approved'); render(); return; }
  if(action==='rejectIncident'){ handleApproval(t.dataset.id,'rejected'); render(); return; }
  if(action==='generateAiAnalysis'){ handleGenerateAiAnalysis(t.dataset.id); return; }
  if(action==='completeAction'){ e.preventDefault(); handleCompleteAction(t.dataset.id); return; }
  if(action==='submitSignup'){ handleSignup(); return; }
  if(action==='clearProfile'){ handleClearProfile(); return; }
  if(action==='printReports'){ window.print(); return; }
  if(action==='graphSelectNode'){ App.riskGraphSelectedNode = {type:t.dataset.type, id:t.dataset.id}; render(); return; }
  if(action==='selectFacility'){ App.selectedFacilityId = (App.selectedFacilityId===t.dataset.id) ? null : t.dataset.id; render(); return; }
  if(action==='clearFacilitySelection'){ App.selectedFacilityId = null; render(); return; }
  if(action==='goFacilityScoped'){ App.facilityScope = t.dataset.id; navigate(t.dataset.route); return; }
  if(action==='enterApp'){ navigate('dashboard'); return; }
  if(action==='startDemoFromWelcome'){ startDemo(); return; }
  if(action==='demoNext'){ demoStep(1); return; }
  if(action==='demoBack'){ demoStep(-1); return; }
  if(action==='demoExit'){ exitDemo(); return; }
  if(action==='clearFilters'){ App.filters[t.dataset.scope] = Object.fromEntries(Object.keys(App.filters[t.dataset.scope]).map(function(k){return [k, k==='cell'?null:'']})); App.pages[t.dataset.scope]=1; render(); return; }
  if(action==='page'){ App.pages[t.dataset.key] += parseInt(t.dataset.dir,10); render(); return; }
  if(action==='quickStatus'){ App.filters.actions.status = (App.filters.actions.status===t.dataset.status) ? '' : t.dataset.status; App.pages.actions=1; render(); return; }
  if(action==='matrixCell'){ e.preventDefault(); App.filters.register.cell = (App.filters.register.cell===t.dataset.cell) ? null : t.dataset.cell; App.pages.register=1; render(); return; }
  if(action==='clearCell'){ e.preventDefault(); App.filters.register.cell = null; render(); return; }
  if(action==='toggleRiskDrilldown'){ App.execExpandedRiskId = (App.execExpandedRiskId===t.dataset.id) ? null : t.dataset.id; render(); return; }
  if(action==='recFeedback'){ handleRecommendationFeedback(t.dataset.id, t.dataset.decision); return; }
});

document.addEventListener('change', function(e){
  var id = e.target.id;
  if(id==='facilityScope'){ App.facilityScope = e.target.value; render(); return; }
  if(id==='roleScope'){
    var prevRole = App.currentRole;
    App.currentRole = e.target.value;
    var role = currentRole();
    if(role.scope==='facility' && App.facilityScope==='ALL'){ App.facilityScope = DATA.facilities[0].facility_id; }
    if(role.scope==='all' && ROLES[prevRole].scope==='facility'){ App.facilityScope = 'ALL'; }
    if(!roleCanSeeNav(App.route.name)){ navigate('dashboard'); }
    logAudit({ action:'Role view changed (demo)', entity_type:'Session', entity_id:'N/A',
      previous_value:{role:ROLES[prevRole].label}, new_value:{role:role.label},
      reason:'Role-based access control demonstration -- not a real authentication change.',
      approval_status:'N/A' });
    render();
    return;
  }
  var map = {
    f_inc_facility:['incidents','facility'], f_inc_status:['incidents','status'], f_inc_severity:['incidents','severity'], f_inc_category:['incidents','category'],
    f_act_facility:['actions','facility'], f_act_type:['actions','type'],
    f_reg_facility:['register','facility'], f_reg_category:['register','category'], f_reg_level:['register','level'], f_reg_status:['register','status'],
    f_aud_source:['audit','source'], f_aud_entity:['audit','entityType']
  };
  if(id==='learningGraphSelect'){ App.learningGraphRecId = e.target.value; render(); return; }
  if(id==='riskGraphEquip'){ App.riskGraphEquipmentId = e.target.value; App.riskGraphSelectedNode = null; render(); return; }
  if(map[id]){ App.filters[map[id][0]][map[id][1]] = e.target.value; App.pages[map[id][0]] = 1; render(); }
});

document.addEventListener('input', function(e){
  var id = e.target.id;
  if(id==='f_inc_q'){ App.filters.incidents.q = e.target.value; App.pages.incidents=1; renderDebounced(); }
  if(id==='f_act_q'){ App.filters.actions.q = e.target.value; App.pages.actions=1; renderDebounced(); }
  if(id==='f_aud_q'){ App.filters.audit.q = e.target.value; App.pages.audit=1; renderDebounced(); }
  if(id==='invSearch'){ App.invSearch = e.target.value; renderInvestListOnly(); }
});

var debTimer=null;
function renderDebounced(){ clearTimeout(debTimer); debTimer=setTimeout(render, 180); }

function renderInvestListOnly(){
  // lightweight filter of the left rail without losing textbox focus
  var q = (App.invSearch||'').toLowerCase();
  document.querySelectorAll('.invest-item').forEach(function(el){
    var text = el.textContent.toLowerCase();
    el.style.display = (!q || text.indexOf(q)>=0) ? '' : 'none';
  });
}

function submitNewIncident(){
  var role = currentRole();
  if(!role.canSubmitIncident){
    alert('Your role ('+role.label+') cannot submit incident reports in this prototype.');
    return;
  }

  var title = document.getElementById('nf_title').value.trim();
  var desc = document.getElementById('nf_desc').value.trim();
  var facility = document.getElementById('nf_facility').value;
  var location = document.getElementById('nf_location').value.trim();
  var severity = document.getElementById('nf_severity').value;
  var dt = document.getElementById('nf_datetime').value;

  // ---- DATA VALIDATION (functional, client-side; see docs/governance-and-controls.md) ----
  var reqErr = Validators.requiredFields({title:title, description:desc, facility:facility}, ['title','description','facility']);
  if(reqErr){ alert(reqErr); return; }
  if(dt){
    var dateErr = Validators.notFutureDate(dt, 'Date/time occurred');
    if(dateErr){ alert(dateErr); return; }
  }

  // ---- real persistence when the backend is reachable; the server's
  // returned row (with its own real incident_id) becomes the local one --
  // falls back to the old local-only insert if the backend call fails, so
  // the form keeps working exactly as before with no backend running. ----
  if(BACKEND_REACHABLE){
    fetch('/api/incidents', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title:title, description:desc, facility_id:facility,
        location: location || null, severity_reported: severity, date_occurred: dt ? dt.slice(0,10) : null })
    }).then(function(resp){ return resp.json().then(function(body){ return {ok:resp.ok, body:body}; }); })
      .then(function(result){
        if(!result.ok){ throw new Error(result.body && result.body.message ? result.body.message : 'Create failed.'); }
        insertLocalIncident(serverIncidentToFrontendShape(result.body), 'Submitted via Incident Reporting form (saved to the real database).');
      })
      .catch(function(){
        insertLocalIncident(localIncidentShape(title, desc, facility, location, severity, dt),
          'Submitted via Incident Reporting form. (Backend unreachable -- this session only; not persisted.)');
      });
  } else {
    insertLocalIncident(localIncidentShape(title, desc, facility, location, severity, dt),
      'Submitted via Incident Reporting form. (Static demo mode -- this session only; not persisted.)');
  }
}

function serverIncidentToFrontendShape(row){
  return {
    incident_id: row.incident_id, facility_id: row.facility_id, equipment_id: row.equipment_id, related_sop_id: null,
    reporter_employee_id: row.reported_by_employee_id, title: row.description.slice(0,80), description: row.description,
    hazard_category: 'Uncategorized - Pending AI Review', shift: 'Day', date_occurred: row.incident_datetime.slice(0,10),
    severity_reported: row.initial_severity, severity_ai: null, ai_confidence: null, status: 'New',
    ai_investigation_summary: null, ai_root_cause: null, created_at: row.reported_at,
    has_full_ai_pipeline: false, ai_pipeline_id: null
  };
}
function localIncidentShape(title, desc, facility, location, severity, dt){
  var id = nextId('INC', DATA.incidents, 'incident_id');
  return {
    incident_id: id, facility_id: facility, equipment_id: null, related_sop_id: null,
    reporter_employee_id: (DATA.employees.find(function(e){return e.facility_id===facility;})||{}).employee_id || 'EMP-0001',
    title: title, description: desc + (location? ' (Location: '+location+')':''), hazard_category: 'Uncategorized - Pending AI Review',
    shift: 'Day', date_occurred: (dt? dt.slice(0,10) : '2026-09-03'), severity_reported: severity, severity_ai: null,
    ai_confidence: null, status: 'New', ai_investigation_summary: null, ai_root_cause: null,
    created_at: '2026-09-03T00:00:00Z', has_full_ai_pipeline: false, ai_pipeline_id: null
  };
}
function insertLocalIncident(incidentObj, reason){
  DATA.incidents.unshift(incidentObj);
  logAudit({ action:'Incident reported', entity_type:'Incident', entity_id:incidentObj.incident_id,
    previous_value:null, new_value:{status:'New', severity_reported:incidentObj.severity_reported, facility_id:incidentObj.facility_id},
    reason: reason, source:'Human-generated', approval_status:'N/A' });
  App.newIncidentOpen = false;
  render();
}

/* =========================================================================
   RENDER / INIT
   ========================================================================= */
function render(){
  // Landing page bypasses the operational shell entirely -- a product
  // introduction screen shouldn't wear the rail/nav chrome of the app it's
  // introducing. Shown once per browser (see boot logic below); reachable
  // again any time at #welcome.
  if(App.route.name==='welcome'){
    document.getElementById('app').innerHTML = renderWelcome();
    return;
  }
  // route guard: a role that can't see a screen can't reach it by typing
  // the hash directly either -- this is the same check renderShell() uses
  // to decide what to list in the nav, applied defensively here too.
  if(App.route.name!=='dashboard' && App.route.name!=='signup' && !roleCanSeeNav(App.route.name)){
    location.hash = '#dashboard';
    App.route = { name:'dashboard', params:{} };
  }
  var app = document.getElementById('app');
  app.innerHTML = renderShell();
  document.getElementById('topbar').outerHTML = renderTopbar();
  var view;
  switch(App.route.name){
    case 'executive': view = renderExecutiveDashboard(); break;
    case 'incidents': view = renderIncidents(); break;
    case 'investigation': view = renderInvestigation(); break;
    case 'actions': view = renderActions(); break;
    case 'register': view = renderRegister(); break;
    case 'riskintel': view = renderRiskIntelligence(); break;
    case 'learning': view = renderContinuousLearning(); break;
    case 'audit': view = renderAuditTrail(); break;
    case 'intelligence': view = renderIntelligence(); break;
    case 'facilities': view = renderFacilities(); break;
    case 'riskgraph': view = renderRiskGraph(); break;
    case 'reports': view = renderReports(); break;
    case 'admin': view = renderAdministration(); break;
    case 'signup': view = renderSignup(); break;
    default: view = renderDashboard();
  }
  setViewRoot(view);
  if(App.route.name==='investigation') pulseCurrentReasoningStage();
  markCriticalAlerts();
  initScrollReveal();
  if(DemoMode.active){
    var panel = document.createElement('div');
    panel.innerHTML = renderDemoPanel();
    app.appendChild(panel.firstElementChild);
  }
}

App.route = parseHash();
if(!location.hash){
  location.hash = getStoredFlag('riskon-visited') ? '#dashboard' : '#welcome';
}
setStoredFlag('riskon-visited', true);

// a previously signed-up profile (this browser, via localStorage) takes
// over both the sidebar display AND the demo role, same as choosing it
// fresh would -- see renderRailUser()/handleSignup().
App.currentUser = getStoredUser();
if(App.currentUser && App.currentUser.rbac_role && ROLES[App.currentUser.rbac_role]){
  App.currentRole = App.currentUser.rbac_role;
}

// the default role (HSE Manager) is facility-scoped -- App.facilityScope must
// actually be set to a real facility on load, not just LOOK that way because
// the <select> falls back to displaying its first option when 'ALL' matches
// nothing. Same normalization the role-switcher's change handler applies.
if(currentRole().scope==='facility' && App.facilityScope==='ALL'){ App.facilityScope = DATA.facilities[0].facility_id; }
if(currentRole().scope==='all'){ App.facilityScope = 'ALL'; }
render();
})();
</script>
