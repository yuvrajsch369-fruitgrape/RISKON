function learningGraphFor(recId){
  var r = lrecById(recId);
  if(!r) return null;
  var inc = r.incident_id ? INC[r.incident_id] : null;
  var act = r.assigned_action_id ? CA[r.assigned_action_id] : null;
  var nodes = [];
  nodes.push(inc ?
    {step:'Incident', label: inc.incident_id+' - '+(inc.hazard_category||''), detail: truncate(inc.description,150)} :
    {step:'Emerging Risk', label: r.risk_signal_id || 'Risk signal', detail:'Recommendation originated from a cross-incident emerging-risk cluster, not a single incident.'});
  nodes.push({step:'AI Recommendation', label:r.recommendation_type, detail:r.recommendation_text});
  nodes.push({step:'Human Decision', label:r.human_decision, detail: r.human_modification_text || r.decision_reason || 'No reason recorded yet.'});
  nodes.push(act ?
    {step:'Action', label:act.corrective_action_id+' - '+act.status, detail:act.description} :
    {step:'Action', label:'No action assigned', detail:'This recommendation was not approved (or not yet decided), so no corrective action exists.'});
  nodes.push(r.evaluation_status==='Evaluated' ?
    {step:'Outcome', label:r.effectiveness_rating, detail:r.outcome_measurement} :
    {step:'Outcome', label:r.evaluation_status, detail:r.outcome_measurement || 'No outcome measured yet.'});
  nodes.push({step:'Learning Signal', label:r.learning_signal||'Not Yet Determined',
    detail:'Per-recommendation signal; see Top Learning Signals above for cross-recommendation patterns.'});
  return nodes;
}

function renderLearningGraphChain(nodes){
  return nodes.map(function(n,i){
    return '<div class="learn-graph-node"><div class="learn-graph-step-label">'+esc(n.step)+'</div>'+
      '<div class="learn-graph-node-body"><div class="learn-graph-node-title">'+esc(n.label)+'</div>'+
      '<div class="learn-graph-node-detail">'+esc(n.detail||'')+'</div></div></div>'+
      (i<nodes.length-1 ? '<div class="learn-graph-arrow">'+ICONS.chevron+'</div>' : '');
  }).join('');
}

function defaultLearningGraphRecId(recs, candidates){
  if(candidates.length && candidates[0].source_recommendation_ids.length){
    return candidates[0].source_recommendation_ids[0];
  }
  var evaluated = recs.find(function(r){ return r.evaluation_status==='Evaluated'; });
  return evaluated ? evaluated.recommendation_id : (recs[0] ? recs[0].recommendation_id : null);
}

function renderLearningGraphSection(ld){
  if(!App.learningGraphRecId){ App.learningGraphRecId = defaultLearningGraphRecId(ld.recommendations, ld.candidates); }
  var decided = ld.recommendations.filter(function(r){ return r.human_decision!=='Pending'; })
    .slice().sort(function(a,b){ return (b.decision_date||'').localeCompare(a.decision_date||''); });
  var opts = decided.map(function(r){
    return '<option value="'+r.recommendation_id+'"'+(App.learningGraphRecId===r.recommendation_id?' selected':'')+'>'+
      r.recommendation_id+' - '+esc(r.hazard_category)+' ('+esc(r.human_decision)+')</option>';
  }).join('');
  var nodes = App.learningGraphRecId ? learningGraphFor(App.learningGraphRecId) : null;
  return '<div class="card card-pad">'+
    '<div class="field" style="max-width:420px;margin-bottom:14px"><label>Recommendation</label>'+
      '<select id="learningGraphSelect">'+opts+'</select></div>'+
    (nodes ? '<div class="learn-graph">'+renderLearningGraphChain(nodes)+'</div>' :
      '<div class="empty-state">No decided recommendation to graph yet.</div>')+
  '</div>';
}

  // "don't trust a stale precomputed count" rule the Dashboard's own tiles

  var pendingRecs = ld.recommendations.filter(function(r){ return r.human_decision==='Pending'; }).length;

  return (
    sectionHeading(1, 'Learning Overview')+

    '<div class="summary-callout" style="margin-top:10px"><p style="font-size:12px">Every signal below is labeled by type and grounded in real decision/outcome counts from the recommendations table &mdash; '+
      '<span class="ev-tag ev-pattern">PATTERN</span> a computed comparison, <span class="ev-tag ev-hypothesis">HYPOTHESIS</span> a possible explanation, and '+
      '<span class="ev-tag ev-recommendation">RECOMMENDATION</span> a proposal for a human to investigate. Signals are recomputed fresh each load, never cached as a fixed fact.</p></div>'+
    (ld.signals.length ? ld.signals.map(renderSignalCard).join('') : '<div class="empty-state">No learning signal met the detection threshold in the current dataset.</div>')+
    sectionHeading(3, 'Recommendation Performance')+
    '<div class="card-head" style="padding:0 0 8px"><span class="card-head-sub">By hazard category &mdash; every count is a real aggregation over the recommendations table, not a fabricated statistic.</span></div>'+
    renderPerformanceTable(ld.performanceByPattern)+
    sectionHeading(4, 'Expert Feedback Patterns')+
    renderExpertFeedback(ld.expertFeedbackPatterns)+
    sectionHeading(5, 'Multi-Facility Learning')+
    renderMultiFacility(ld.multiFacilityLearning)+
    sectionHeading(6, 'Controlled Improvement Pipeline')+
    '<div class="summary-callout" style="margin-top:10px"><p style="font-size:12px">Learning Signal &rarr; Learning Candidate &rarr; Evaluation &rarr; Sandbox/Test &rarr; Performance Comparison &rarr; Human/Engineering Approval &rarr; Controlled Version Update &rarr; Monitoring. A candidate never reaches "Version Update" without passing configured thresholds <i>and</i> explicit human approval &mdash; see docs/continuous-learning-engine.md &sect;7.</p></div>'+
    '<h3 style="margin:14px 0 8px;font-size:13px">Version Catalog</h3>'+renderVersionsTable(ld.versions)+
    '<h3 style="margin:18px 0 8px;font-size:13px">Learning Candidates</h3>'+
    (ld.candidates.length ? ld.candidates.map(renderCandidateCard).join('') : '<div class="empty-state">No learning candidate has been proposed yet.</div>')+
    sectionHeading(7, 'Try It - Human Feedback Loop')+
    '<div class="summary-callout" style="margin-top:10px"><p style="font-size:12px">Approve, modify, reject, or request more information on a real pending recommendation below. Your decision is recorded on the recommendation and logged to the Audit Trail immediately (see the Learning Overview and Audit Trail counts update) &mdash; it is never applied automatically to any future recommendation. Recommendation Performance, Top Learning Signals, and the other pattern-level sections above reflect the dataset as of page load, the same way Risk Intelligence and the Executive Dashboard do elsewhere in RISKON; they pick up this decision the next time the underlying data is regenerated.</p></div>'+
    renderFeedbackDemo(ld.recommendations)+
    sectionHeading(8, 'Learning Graph')+
    '<div class="summary-callout" style="margin-top:10px"><p style="font-size:12px">Incident &rarr; Recommendation &rarr; Human Decision &rarr; Action &rarr; Outcome &rarr; Learning Signal, for one recommendation at a time.</p></div>'+
    renderLearningGraphSection(ld)+
    sectionHeading(9, '5-Minute Guided Demo')+
    renderGuidedDemo()

function auditSortKey(ts){
  // seed data mixes 'YYYY-MM-DD HH:MM:SS', date-only 'YYYY-MM-DD', and ISO-Z
  // 'YYYY-MM-DDTHH:MM:SSZ'; live-logged entries add their own space-separated
  // form. Comparing the raw strings put live entries (space-separated) before
  // same-day ISO-Z seed entries, since ' ' sorts before 'T' -- always parse
  // to a real timestamp for sorting instead of comparing strings.
  var s = String(ts).indexOf('T')>=0 ? ts : String(ts).replace(' ', 'T');
  var t = new Date(s).getTime();
  return isNaN(t) ? 0 : t;
}
function auditSourceTone(s){ return s==='AI-generated' ? 'accent' : 'neutral'; }
function auditApprovalTone(s){ return {Approved:'good', Rejected:'critical', Pending:'warning'}[s] || 'neutral'; }

function renderAuditTrail(){
  var f = App.filters.audit;
  var list = DATA.auditTrail.slice();
  if(f.q){
    var needle = f.q.toLowerCase();
    list = list.filter(function(e){ return (e.action+' '+e.entity_id+' '+e.user+' '+(e.reason||'')).toLowerCase().indexOf(needle)>=0; });
  }
  if(f.source) list = list.filter(function(e){ return e.source===f.source; });
  if(f.entityType) list = list.filter(function(e){ return e.entity_type===f.entityType; });
  list = list.slice().sort(function(a,b){ return auditSortKey(b.timestamp) - auditSortKey(a.timestamp); });

  var aiCount = DATA.auditTrail.filter(function(e){ return e.source==='AI-generated'; }).length;
  var pendingCount = DATA.auditTrail.filter(function(e){ return e.approval_status==='Pending'; }).length;

  var p = paginate(list, App.pages.audit);
  var rows = p.rows.map(function(e){
    return '<tr><td class="mono td-muted" style="white-space:nowrap">'+esc(String(e.timestamp).slice(0,16))+'</td>'+
      '<td><div style="font-weight:600">'+esc(e.user)+'</div><div class="td-muted" style="font-size:10.5px">'+esc(e.user_role)+'</div></td>'+
      '<td>'+esc(e.action)+'</td>'+
      '<td class="td-id">'+esc(e.entity_type)+' '+esc(e.entity_id)+'</td>'+
      '<td>'+pill(e.source, auditSourceTone(e.source))+'</td>'+
      '<td>'+(e.approval_status && e.approval_status!=='N/A' ? pill(e.approval_status, auditApprovalTone(e.approval_status)) : '<span class="td-muted">&mdash;</span>')+'</td>'+
      '<td class="td-muted" style="max-width:240px;white-space:normal;font-size:11.5px">'+esc(truncate(e.reason||'',90))+'</td>'+
    '</tr>';
  }).join('');

  var entityTypes = Array.from(new Set(DATA.auditTrail.map(function(e){ return e.entity_type; }))).sort();
  var entityOpts = entityTypes.map(function(t){ return '<option value="'+t+'"'+(f.entityType===t?' selected':'')+'>'+t+'</option>'; }).join('');

  return (
    '<div class="tiles">'+
      '<div class="tile" style="--tile-accent:var(--accent)"><div class="tile-label">Total Log Entries</div><div class="tile-value mono">'+DATA.auditTrail.length+'</div><div class="tile-sub">seed history + this session\'s actions</div></div>'+
      '<div class="tile" style="--tile-accent:var(--warning)"><div class="tile-label">AI-Generated Entries</div><div class="tile-value mono">'+aiCount+'</div><div class="tile-sub">recommendations awaiting or given human review</div></div>'+
      '<div class="tile" style="--tile-accent:var(--serious)"><div class="tile-label">Pending Human Review</div><div class="tile-value mono">'+pendingCount+'</div><div class="tile-sub">approval_status = Pending</div></div>'+
      '<div class="tile" style="--tile-accent:var(--good)"><div class="tile-label">Human-Generated Entries</div><div class="tile-value mono">'+(DATA.auditTrail.length-aiCount)+'</div><div class="tile-sub">reports, reviews, verifications, closures</div></div>'+
    '</div>'+
    '<div class="summary-callout" style="margin-top:16px"><h3>What this demonstrates</h3><p>Every row is a discrete, timestamped state change: who (or what) made it, what changed from/to, why, whether it originated from a person or the AI reasoning engine, and its approval status. Approving or rejecting an incident in AI Investigation, or submitting a new incident report, appends a live entry here immediately &mdash; try it, then come back to this screen.</p></div>'+
    '<div class="filterbar" style="margin-top:14px">'+
      '<div class="field search"><label>Search</label><input type="text" id="f_aud_q" placeholder="User, action, entity ID, reason&hellip;" value="'+esc(f.q)+'"/></div>'+
      '<div class="field"><label>Source</label><select id="f_aud_source"><option value="">Source &mdash; All</option><option value="AI-generated"'+(f.source==='AI-generated'?' selected':'')+'>AI-generated</option><option value="Human-generated"'+(f.source==='Human-generated'?' selected':'')+'>Human-generated</option></select></div>'+
      '<div class="field"><label>Entity Type</label><select id="f_aud_entity"><option value="">Entity &mdash; All</option>'+entityOpts+'</select></div>'+
      '<button class="btn btn-sm filterbar-clear" data-action="clearFilters" data-scope="audit">Clear</button>'+
    '</div>'+
    '<div class="tablewrap"><table><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Entity</th><th>Source</th><th>Approval</th><th>Reason</th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="7" class="empty-state">No log entries match these filters.</td></tr>')+'</tbody></table>'+pagerHtml(p,'audit')+'</div>'
  );
}

function paginate(arr, page){
  var start=(page-1)*PAGE_SIZE;
  return { rows: arr.slice(start,start+PAGE_SIZE), total: arr.length, page: page, pages: Math.max(1,Math.ceil(arr.length/PAGE_SIZE)) };
}
function pagerHtml(p, key){
  return '<div class="pager"><span>'+((p.total===0)?0:((p.page-1)*PAGE_SIZE+1))+'&ndash;'+Math.min(p.page*PAGE_SIZE,p.total)+' of '+p.total+'</span>'+
    '<span style="display:flex;gap:6px"><button class="btn btn-sm" data-action="page" data-key="'+key+'" data-dir="-1" '+(p.page<=1?'disabled':'')+'>Prev</button>'+
    '<button class="btn btn-sm" data-action="page" data-key="'+key+'" data-dir="1" '+(p.page>=p.pages?'disabled':'')+'>Next</button></span></div>';
}

      '<div class="field"><label>Reported severity</label><select id="nf_severity"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div>'+
      '<div class="field span3"><label>Description</label><textarea id="nf_desc" placeholder="What happened, who was involved, any injuries or near-miss details&hellip;"></textarea></div>'+
    '</div>'+
    '<div class="newform-actions"><button class="btn" data-action="toggleNewIncident">Cancel</button><button class="btn btn-primary" data-action="submitIncident">Submit Report</button></div>'+
    '</div></div>';
}

/* =========================================================================
   VIEW: AI INVESTIGATION
   ========================================================================= */
function fieldRow(label, field){
  if(!field) return '';
  var missing = field.insufficient_information;
  return '<div class="fact"><div class="fact-k">'+label+'</div><div class="fact-v'+(missing?' missing':'')+'">'+
    (missing ? 'Insufficient information &mdash; human investigation required.' : esc(field.value)) +
    '<span class="src-tag">'+field.source.replace(/_/g,' ')+(field.confidence!=null?' &middot; '+fmtPct(field.confidence):'')+'</span>'+
  '</div></div>';
}

function reasonItem(title, badgeHtml, confidence, evidenceLabel, evidenceText, extra){
  return '<div class="reason-item">'+
    '<div class="reason-item-top"><div class="reason-item-title">'+title+'</div>'+
      (confidence!=null ? '<div class="confidence"><div class="confidence-bar"><div class="confidence-fill" style="width:'+Math.round(confidence*100)+'%"></div></div><span class="confidence-val">'+fmtPct(confidence)+'</span></div>' : '')+
    '</div>'+
    (badgeHtml||'')+
    (extra||'')+
    '<details class="evidence"><summary></summary><div class="evidence-text">'+esc(evidenceText||'')+'</div></details>'+
  '</div>';
}

function renderFullPipeline(pipeline, incident){
  var s2=pipeline.stage_2_information_extraction, s3=pipeline.stage_3_classification,
      s4=pipeline.stage_4_hazard_identification, s5=pipeline.stage_5_potential_consequences,
      s6=pipeline.stage_6_preliminary_severity_assessment, s7=pipeline.stage_7_contributing_factors,
      s8=pipeline.stage_8_root_cause_hypotheses, s9=pipeline.stage_9_existing_controls,
      s10=pipeline.stage_10_control_gaps, s11=pipeline.stage_11_recommended_actions,
      s12=pipeline.stage_12_risk_register_impact, s13=pipeline.stage_13_human_review_package;

  var out = '';
  out += '<div class="summary-callout"><h3>AI Summary &mdash; Pending Human Review</h3><p>'+esc(s13.summary_for_reviewer)+'</p>'+
    '<p style="margin-top:8px;font-size:11px;color:var(--ink-2)"><b>Data sources:</b> submitted incident report text, facility/equipment/SOP records &middot; '+
    '<b>Model:</b> '+esc(pipeline.model || 'claude-sonnet-5')+' &middot; <b>Pipeline run:</b> '+esc(pipeline.pipeline_run_id || pipeline.incident_id)+' &middot; '+
    '<b>Human approval status:</b> '+esc((s13.approval && s13.approval.decision) || 'pending')+'</p></div>';

  out += stageBlock('2','Information Extraction','Facts extracted directly from the submitted report text.',
    '<div class="factgrid">'+
      fieldRow('Who Involved', s2.who_involved)+fieldRow('What Happened', s2.what_happened)+
      fieldRow('When Occurred', s2.when_occurred)+fieldRow('Where', s2.where_location)+
      fieldRow('Equipment', s2.equipment_involved)+fieldRow('Injuries Reported', s2.injuries_reported)+
      fieldRow('Witnesses', s2.witnesses)+fieldRow('Environmental Conditions', s2.environmental_conditions)+
    '</div>', ['fact','FACT']);

  out += stageBlock('3','Classification','AI-assigned category &mdash; requires human confirmation.',
    '<div class="factgrid">'+fieldRow('Incident Category', s3.incident_category)+fieldRow('Incident Type', s3.incident_type)+'</div>', ['pattern','AI ANALYSIS']);

  out += stageBlock('4','Hazard Identification','', s4.hazards.map(function(h){
    return reasonItem(esc(h.hazard_type), '<div style="font-size:12px;color:var(--ink-2);margin-bottom:2px">'+esc(h.description)+'</div>', h.confidence, 'Evidence', h.evidence);
  }).join('') + '<div class="evidence-text" style="margin-top:6px;font-size:11.5px;color:var(--ink-3);border:none;padding:0">'+esc(s4.coverage_note)+'</div>', ['pattern','AI ANALYSIS']);

  out += stageBlock('5','Potential Consequence Assessment','Reasonable worst case &mdash; hypothetical, not what occurred.', s5.consequences.map(function(c){
    return reasonItem(esc(c.description), pill(c.plausible_worst_case_severity, severityTone(c.plausible_worst_case_severity)), c.confidence, 'Evidence', c.evidence);
  }).join(''), ['hypothesis','AI HYPOTHESIS']);

  out += stageBlock('6','Preliminary Severity Assessment','Status: pending human confirmation.',
    '<div class="cols-3">'+
      '<div class="reason-item"><div class="fact-k">AI-Suggested Severity</div><div style="margin-top:6px">'+pill(s6.ai_suggested_severity.value, severityTone(s6.ai_suggested_severity.value))+'</div><div class="evidence-text" style="margin-top:8px">'+esc(s6.ai_suggested_severity.reasoning)+'</div></div>'+
      '<div class="reason-item"><div class="fact-k">Recurrence Likelihood</div><div style="margin-top:6px;font-weight:600">'+esc(s6.ai_suggested_recurrence_likelihood.value)+'</div><div class="evidence-text" style="margin-top:8px">'+esc(s6.ai_suggested_recurrence_likelihood.reasoning)+'</div></div>'+
      '<div class="reason-item"><div class="fact-k">Reported Severity (Human)</div><div style="margin-top:6px">'+pill(incident.severity_reported, severityTone(incident.severity_reported))+'</div><div class="evidence-text" style="margin-top:8px">As submitted by the reporter, prior to AI review.</div></div>'+
    '</div>', ['pattern','AI ANALYSIS']);

  out += stageBlock('7','Contributing-Factor Analysis','', s7.factors.map(function(f){
    return reasonItem('<span class="pill tone-neutral">'+f.category+'</span> '+esc(f.description), '', f.confidence, 'Evidence', f.evidence);
  }).join(''), ['pattern','AI ANALYSIS']);

  out += stageBlock('8','Root-Cause Hypotheses','Ranked hypotheses &mdash; never a confirmed cause.', s8.hypotheses.map(function(hy){
    return reasonItem('#'+hy.rank+' &nbsp;'+esc(hy.statement), '<span class="pill tone-neutral" style="margin-bottom:6px">Hypothesis &mdash; not confirmed</span>', hy.confidence, 'Evidence', 'Supporting: '+hy.supporting_evidence+(hy.contradicting_evidence? '\\n\\nOpen question: '+hy.contradicting_evidence : ''));
  }).join(''), ['hypothesis','AI HYPOTHESIS']);

  out += stageBlock('9','Existing-Control Identification','', s9.controls.map(function(c){
    var st = c.status==='present'?'good':(c.status==='absent'?'critical':'neutral');
    return reasonItem(esc(c.control_description)+' <span style="font-weight:400;color:var(--ink-3)">('+c.control_type+')</span>', pill(c.status.replace(/_/g,' '), st), null, 'Evidence', c.evidence);
  }).join(''), ['fact','FACT']);

  out += stageBlock('10','Control-Gap Identification','', s10.gaps.map(function(g){
    return reasonItem(esc(g.gap_description), '', g.confidence, 'Evidence', g.evidence);
  }).join(''), ['hypothesis','AI HYPOTHESIS']);

  out += stageBlock('11','Recommended Corrective / Preventive Actions','Recommendations only &mdash; none are auto-assigned.',
    '<div class="tablewrap" style="border:none"><table><thead><tr><th>Type</th><th>Description</th><th>Priority</th><th>Owner Role</th><th>Timeframe</th></tr></thead><tbody>'+
    s11.actions.map(function(a){
      return '<tr><td>'+pill(a.action_type, a.action_type==='Corrective'?'accent':'neutral')+'</td><td class="td-title" style="max-width:260px;white-space:normal">'+esc(a.description)+'</td><td>'+pill(a.priority, severityTone(a.priority==='Critical'?'Critical':a.priority==='High'?'High':a.priority==='Medium'?'Medium':'Low'))+'</td><td class="td-muted">'+esc(a.suggested_owner_role)+'</td><td class="mono td-muted">'+a.suggested_timeframe_days+'d</td></tr>';
    }).join('') + '</tbody></table></div>', ['recommendation','RECOMMENDATION']);

  out += stageBlock('12','Risk-Register Impact','Proposed diff only &mdash; not written until approved.',
    '<div class="cols-3">'+
      '<div class="reason-item"><div class="fact-k">Proposed Action</div><div style="margin-top:6px;font-weight:600">'+ (s12.proposed_action==='create_new_risk'?'Create New Risk Entry':'Update Existing Risk') +'</div></div>'+
      '<div class="reason-item"><div class="fact-k">Likelihood &times; Impact</div><div style="margin-top:6px" class="mono">'+s12.likelihood.value+' &times; '+s12.impact.value+' = '+s12.risk_score.value+'</div></div>'+
      '<div class="reason-item"><div class="fact-k">Risk Level</div><div style="margin-top:6px">'+pill(s12.risk_level.value, riskLevelTone(s12.risk_level.value))+'</div></div>'+
    '</div><div class="evidence-text" style="margin-top:10px">'+esc(s12.reasoning)+'</div>', ['recommendation','RECOMMENDATION']);

  return out;
}

function stageBlock(num, title, sub, body, tag){
  return '<div class="stage"><div class="stage-head"><span class="stage-num">'+num+'</span><span class="stage-title">'+title+'</span>'+
    (tag?'<span class="ev-tag ev-'+tag[0]+'" style="margin-left:10px">'+tag[1]+'</span>':'')+
    (sub?'<span style="font-size:11px;color:var(--ink-3);margin-left:auto">'+sub+'</span>':'')+'</div><div class="stage-body">'+body+'</div></div>';
}

function renderCondensedPipeline(incident){
  if(incident.severity_ai != null || incident.ai_investigation_summary){
    return stageBlock('&mdash;','Condensed AI Summary','No full stage-by-stage trace generated for this incident.',
      '<div class="factgrid">'+
        '<div class="fact"><div class="fact-k">AI Category</div><div class="fact-v">'+esc(incident.hazard_category)+'</div></div>'+
        '<div class="fact"><div class="fact-k">AI-Suggested Severity</div><div class="fact-v">'+pill(incident.severity_ai, severityTone(incident.severity_ai))+' <span class="src-tag">confidence '+fmtPct(incident.ai_confidence)+'</span></div></div>'+
      '</div>'+
      '<div style="margin-top:12px" class="reason-item"><div class="fact-k">Preliminary Investigation</div><div class="evidence-text" style="margin-top:6px">'+esc(incident.ai_investigation_summary)+'</div></div>'+
      '<div style="margin-top:8px" class="reason-item"><div class="fact-k">Leading Root-Cause Hypothesis</div><div class="evidence-text" style="margin-top:6px">'+esc(incident.ai_root_cause)+'</div></div>'
    );
  }
  return stageBlock('&mdash;','AI Analysis','Not yet generated for this incident.',
    '<div class="factgrid">'+
      '<div class="fact"><div class="fact-k">Hazard Category</div><div class="fact-v">'+esc(incident.hazard_category)+'</div></div>'+
      '<div class="fact"><div class="fact-k">Reported Severity</div><div class="fact-v">'+pill(incident.severity_reported, severityTone(incident.severity_reported))+'</div></div>'+
    '</div>'+
    '<div class="evidence-text" style="margin-top:12px">No AI classification, investigation, or root-cause hypothesis has been generated for this incident yet.</div>'+
    renderAiAnalysisButton(incident)
  );
}

/* ---- live AI analysis (backend/routes/incidents.py POST .../analyze) ----
   renderAiAnalysisButton() shows exactly one of three honest states -- it
   never pretends AI ran when it didn't:
     1. no backend reachable at all (static demo mode, same as before)
     2. backend reachable but ANTHROPIC_API_KEY not set (server-verified,
        not guessed client-side)
     3. backend reachable and AI configured -- a real, wired button ---- */
function renderAiAnalysisButton(incident){
  if(App.aiAnalysisLoading === incident.incident_id){
    return '<div style="margin-top:10px"><button class="btn btn-sm" disabled>'+ICONS.search+' Analyzing with Claude&hellip;</button></div>';
  }
  if(!BACKEND_REACHABLE){
    return '<div style="margin-top:10px"><button class="btn btn-sm" disabled title="No backend reachable">'+ICONS.search+' Generate AI Analysis</button>'+
      '<div style="margin-top:6px;font-size:11px;color:var(--ink-3)">Static demo mode &mdash; no backend reachable. Run the RISKON backend (see README.md) to enable live AI analysis.</div></div>';
  }
  if(!AI_CONFIGURED){
    return '<div style="margin-top:10px"><button class="btn btn-sm" disabled title="ANTHROPIC_API_KEY not set">'+ICONS.search+' Generate AI Analysis</button>'+
      '<div style="margin-top:6px;font-size:11px;color:var(--critical)">AI provider not configured. Add ANTHROPIC_API_KEY to the environment to enable AI features.</div></div>';
  }
  return '<div style="margin-top:10px"><button class="btn btn-sm btn-primary" data-action="generateAiAnalysis" data-id="'+incident.incident_id+'">'+ICONS.search+' Generate AI Analysis</button></div>';
}

function renderLiveAiAnalysis(incident, record){
  var a = record.analysis;
  var statusLabel = record.human_review_status==='Pending' ? 'Pending Human Review' : record.human_review_status;
  var out = '<div class="summary-callout"><h3>Live AI Analysis &mdash; '+esc(statusLabel)+'</h3><p>'+esc(a.summary)+'</p>'+
    '<p style="margin-top:8px;font-size:11px;color:var(--ink-2)"><b>Model:</b> '+esc(record.model)+
    ' &middot; <b>Confidence:</b> '+fmtPct(a.confidence)+' &middot; <b>Generated:</b> '+esc(record.created_at)+
    ' &middot; <b>Analysis ID:</b> '+esc(record.analysis_id)+'</p></div>';

  out += stageBlock('&mdash;','Observed Facts','Directly supported by the incident context supplied to the model &mdash; not inferred.',
    a.observed_facts.length ? a.observed_facts.map(function(f){ return evLine({type:'OBSERVED_FACT', statement:f}); }).join('')
      : '<span style="font-size:12px;color:var(--ink-3)">None stated.</span>');

  out += stageBlock('&mdash;','AI Hypotheses','Candidate explanations &mdash; never a confirmed cause.',
    a.ai_hypotheses.length ? a.ai_hypotheses.map(function(h){ return evLine({type:'AI_HYPOTHESIS', statement:h}); }).join('')
      : '<span style="font-size:12px;color:var(--ink-3)">None.</span>');

  if(a.related_risk_signals.length){
    out += stageBlock('&mdash;','Related Risk Signals','', a.related_risk_signals.map(function(s){ return evLine({type:'STATISTICAL_PATTERN', statement:s}); }).join(''));
  }

  out += stageBlock('&mdash;','Recommendations','Suggestions for human review &mdash; none are auto-assigned.',
    a.recommendations.length ? a.recommendations.map(function(r){ return evLine({type:'RECOMMENDATION', statement:r}); }).join('')
      : '<span style="font-size:12px;color:var(--ink-3)">None.</span>');

  if(a.uncertainties.length){
    out += stageBlock('&mdash;','Uncertainties','What the supplied context does not establish.',
      '<div class="evidence-text">'+a.uncertainties.map(function(u){return esc(u);}).join('<br>')+'</div>');
  }
  if(a.evidence.length){
    out += '<div style="font-size:11px;color:var(--ink-3);margin:6px 0 14px">Evidence references: '+a.evidence.map(function(e){return esc(e);}).join(', ')+'</div>';
  }

  out += '<div style="margin-top:4px"><button class="btn btn-sm" data-action="generateAiAnalysis" data-id="'+incident.incident_id+'">'+ICONS.search+' Re-analyze</button></div>';
  return out;
}

function renderInvestigation(){
  var incs = DATA.incidents.filter(function(i){ return inScope(i.facility_id); }).slice().sort(function(a,b){ return new Date(b.date_occurred)-new Date(a.date_occurred); });
  var reviewQueue = incs.filter(function(i){ return i.status==='New'||i.status==='In Review'; });
  var rest = incs.filter(function(i){ return !(i.status==='New'||i.status==='In Review'); });
  var ordered = reviewQueue.concat(rest);

  if(!App.selectedIncidentId || !incs.some(function(i){return i.incident_id===App.selectedIncidentId;})){
    App.selectedIncidentId = (ordered.find(function(i){return i.has_full_ai_pipeline;}) || ordered[0] || incs[0]).incident_id;
  }
  var incident = DATA.incidents.find(function(i){ return i.incident_id===App.selectedIncidentId; });

  var listItems = ordered.map(function(i){
    return '<button class="invest-item'+(i.incident_id===App.selectedIncidentId?' active':'')+'" data-action="selectIncident" data-id="'+i.incident_id+'">'+
      '<div class="invest-item-id"><span>'+i.incident_id+'</span><span>'+fmtDateShort(i.date_occurred)+'</span></div>'+
      '<div class="invest-item-title">'+esc(truncate(i.title,46))+'</div>'+
      '<div class="invest-item-meta">'+pill(i.severity_reported,severityTone(i.severity_reported))+pill(i.status,incidentStatusTone(i.status))+(i.has_full_ai_pipeline?'<span class="ai-tag">Trace</span>':'')+'</div>'+
    '</button>';
  }).join('');

  var detail = '';
  if(incident){
    detail += '<div class="card card-pad" style="margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">'+
        '<div style="min-width:0"><div class="td-id" style="font-size:12px">'+incident.incident_id+' &middot; '+esc(facName(incident.facility_id))+'</div><h2 style="font-size:17px;margin-top:4px;word-break:break-word">'+esc(incident.title)+'</h2>'+
        '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+pill('Reported: '+incident.severity_reported, severityTone(incident.severity_reported))+pill(incident.status, incidentStatusTone(incident.status))+'<span class="pill tone-neutral">'+esc(incident.hazard_category)+'</span></div></div>'+
      '</div>'+
      '<div class="evidence-text" style="margin-top:12px">'+esc(incident.description)+'</div>'+
      '<div style="margin-top:8px;font-size:11.5px;color:var(--ink-3)">Reported by '+esc(empName(incident.reporter_employee_id))+' ('+esc(empRole(incident.reporter_employee_id))+') &middot; Occurred '+fmtDate(incident.date_occurred)+
        (incident.equipment_id? ' &middot; Equipment: '+esc(eqType(incident.equipment_id)) : '')+
        (incident.related_sop_id? ' &middot; Related SOP: '+esc(sopTitle(incident.related_sop_id)) : '')+
      '</div>'+
    '</div>';

    var pipeline = incident.has_full_ai_pipeline ? DATA.aiPipelines[incident.ai_pipeline_id] : null;
    var liveAnalysis = App.liveAnalyses[incident.incident_id];
    if(pipeline){ detail += renderFullPipeline(pipeline, incident); }
    else if(liveAnalysis){ detail += renderLiveAiAnalysis(incident, liveAnalysis); }
    else { detail += renderCondensedPipeline(incident); }
    detail += renderApprovalBar(incident);
  } else {
    detail = '<div class="empty-state">Select an incident from the list.</div>';
  }

  return '<div class="invest-shell">'+
    '<div class="invest-list"><div class="invest-list-search"><input type="text" placeholder="Filter incidents&hellip;" id="invSearch" value="'+esc(App.invSearch||'')+'"/></div><div class="invest-list-items">'+(listItems||'<div class="empty-state">No incidents.</div>')+'</div></div>'+
    '<div>'+detail+'</div>'+
  '</div>';
}

function renderApprovalBar(incident){
  if(incident.status==='Approved'){
    return '<div class="approval-banner approved">'+ICONS.check+' Approved &mdash; risk register and corrective actions updated.</div>';
  }
  if(incident.status==='Rejected'){
    return '<div class="approval-banner rejected">'+ICONS.x+' Rejected &mdash; no changes were made to the risk register.</div>';
  }
  var role = currentRole();
  if(!role.canApprove){
    return '<div class="approval-bar">'+
      '<h4>'+ICONS.lock+' Human Review Decision</h4>'+
      '<div style="font-size:11.5px;color:var(--ink-3);margin-top:2px">The AI cannot approve its own recommendation, and your current role cannot either.</div>'+
      '<div class="evidence-text" style="margin-top:10px">Viewing as <b>'+role.label+'</b> &mdash; this role does not have approval authority for AI-generated safety recommendations. '+
      'Switch to HSE Manager or Plant Manager (top of sidebar) to approve or reject, or ask one of them to review this incident.</div>'+
    '</div>';
  }
  return '<div class="approval-bar">'+
    '<h4>Human Review Decision <span class="ev-tag ev-human" style="margin-left:4px">HUMAN DECISION</span></h4>'+
    '<div style="font-size:11.5px;color:var(--ink-3);margin-top:2px">Approving will create/update the linked risk-register entry and open the recommended corrective/preventive actions. Nothing above has been written to the register yet. This decision is recorded in the Audit Trail.</div>'+
    '<div class="approval-row">'+
      '<textarea id="reviewComment" placeholder="Optional reviewer comment&hellip;" rows="1"></textarea>'+
      '<button class="btn btn-primary" data-action="approveIncident" data-id="'+incident.incident_id+'">'+ICONS.check+' Approve</button>'+
      '<button class="btn btn-danger" data-action="rejectIncident" data-id="'+incident.incident_id+'">'+ICONS.x+' Reject</button>'+
    '</div>'+
  '</div>';
}

/* =========================================================================
   VIEW: CORRECTIVE ACTIONS
   ========================================================================= */
function renderActions(){
  var f = App.filters.actions;
  var list = DATA.correctiveActions.filter(function(a){ return inScope(a.facility_id); });

  var counts = {Open:0,'In Progress':0,Completed:0,Overdue:0};
  list.forEach(function(a){ counts[a.status]=(counts[a.status]||0)+1; });

  if(f.q) list = list.filter(function(a){ return (a.description+' '+a.corrective_action_id).toLowerCase().indexOf(f.q.toLowerCase())>=0; });
  if(f.facility) list = list.filter(function(a){ return a.facility_id===f.facility; });
  if(f.type) list = list.filter(function(a){ return a.action_type===f.type; });
  if(f.status) list = list.filter(function(a){ return a.status===f.status; });
  list = list.slice().sort(function(a,b){ return new Date(a.due_date)-new Date(b.due_date); });

  var p = paginate(list, App.pages.actions);
  var cards = p.rows.map(function(a){ return actionFeedCard(a, true); }).join('');

  var facOpts = '<option value="">Facility &mdash; All</option>'+DATA.facilities.map(function(fac){ return '<option value="'+fac.facility_id+'"'+(f.facility===fac.facility_id?' selected':'')+'>'+esc(facName(fac.facility_id))+'</option>'; }).join('');
  var typeOpts = ['Corrective','Preventive'].map(function(t){ return '<option value="'+t+'"'+(f.type===t?' selected':'')+'>'+t+'</option>'; }).join('');

  var chips = ['Open','In Progress','Overdue','Completed'].map(function(s){
    return '<div class="chip'+(f.status===s?' active':'')+'" data-action="quickStatus" data-status="'+s+'"><span class="chip-count" style="color:var(--'+actionStatusToneColor(s)+')">'+(counts[s]||0)+'</span> '+s+'</div>';
  }).join('');

  return (
    '<div class="chipbar">'+chips+'</div>'+
    '<div class="filterbar">'+
      '<div class="field search"><label>Search</label><input type="text" id="f_act_q" placeholder="Action description or ID&hellip;" value="'+esc(f.q)+'"/></div>'+
      '<div class="field"><label>Facility</label><select id="f_act_facility">'+facOpts+'</select></div>'+
      '<div class="field"><label>Type</label><select id="f_act_type"><option value="">Type &mdash; All</option>'+typeOpts+'</select></div>'+
      '<button class="btn btn-sm filterbar-clear" data-action="clearFilters" data-scope="actions">Clear</button>'+
    '</div>'+
    '<div class="feed-list">'+(cards||'<div class="empty-state">No actions match these filters.</div>')+'</div>'+
    (p.total ? '<div style="margin-top:12px">'+pagerHtml(p,'actions')+'</div>' : '')
  );
}

/* =========================================================================
   VIEW: MANAGEMENT INTELLIGENCE
   ========================================================================= */
function renderIntelligence(){
  var incs = DATA.incidents.filter(function(i){ return inScope(i.facility_id); });
  var risks = DATA.riskAssessments.filter(function(r){ return inScope(r.facility_id); });
  var actions = DATA.correctiveActions.filter(function(a){ return inScope(a.facility_id); });

  var openExposure = Math.round(risks.filter(function(r){return r.status==='Open';}).reduce(function(s,r){return s+r.risk_score;},0) * 10) / 10;
  var completed = actions.filter(function(a){return a.status==='Completed';}).length;
  var closureRate = actions.length ? Math.round(completed/actions.length*100) : 0;
  var facilitiesElevated = DATA.facilities.filter(function(fac){ return risks.some(function(r){ return r.facility_id===fac.facility_id && r.status==='Open' && r.risk_level==='Critical'; }); }).length;

  var catCounts = {}; incs.forEach(function(i){ catCounts[i.hazard_category]=(catCounts[i.hazard_category]||0)+1; });
  var catItems = Object.keys(catCounts).map(function(k){return {label:k,value:catCounts[k]};}).sort(function(a,b){return b.value-a.value;}).slice(0,10);

  var monthMap = {};
  incs.forEach(function(i){ var mk=monthKey(i.date_occurred); monthMap[mk]=monthMap[mk]||{Low:0,Medium:0,High:0,Critical:0}; monthMap[mk][i.severity_reported]=(monthMap[mk][i.severity_reported]||0)+1; });
  var months = Object.keys(monthMap).sort().slice(-12);
  var buckets = months.map(function(mk){ return Object.assign({label:monthLabel(mk)}, monthMap[mk]); });
  var sevColors = {Low:'var(--good)',Medium:'var(--warning)',High:'var(--serious)',Critical:'var(--critical)'};

  var facRows = DATA.facilities.map(function(fac){
    var fr = risks.filter(function(r){return r.facility_id===fac.facility_id;});
    var counts = {Low:0,Medium:0,High:0,Critical:0};
    fr.filter(function(r){return r.status==='Open';}).forEach(function(r){counts[r.risk_level]++;});
    return {label: facShort(fac.facility_id), counts: counts};
  });

  var capaCounts = {Open:0,'In Progress':0,Overdue:0,Completed:0};
  actions.forEach(function(a){ capaCounts[a.status]=(capaCounts[a.status]||0)+1; });
  var capaColors = {Open:'var(--accent)','In Progress':'var(--warning)',Overdue:'var(--critical)',Completed:'var(--good)'};

  var scoreRows = DATA.facilities.map(function(fac){
    var fi = incs.filter(function(i){return i.facility_id===fac.facility_id;});
    var fr = risks.filter(function(r){return r.facility_id===fac.facility_id;});
    var fa = actions.filter(function(a){return a.facility_id===fac.facility_id;});
    var confVals = fi.filter(function(i){return i.ai_confidence!=null;}).map(function(i){return i.ai_confidence;});
    var avgConf = confVals.length ? confVals.reduce(function(s,v){return s+v;},0)/confVals.length : null;
    return '<tr><td class="td-title">'+esc(facName(fac.facility_id))+'</td>'+
      '<td class="mono">'+fi.filter(function(i){return i.status!=='Closed'&&i.status!=='Rejected';}).length+'</td>'+
      '<td class="mono">'+fr.filter(function(r){return r.status==='Open'&&(r.risk_level==='High'||r.risk_level==='Critical');}).length+'</td>'+
      '<td class="mono">'+fa.filter(function(a){return a.status==='Overdue';}).length+'</td>'+
      '<td class="mono">'+fmtPct(avgConf)+'</td></tr>';
  }).join('');

  return (
    '<div class="tiles">'+
      '<div class="tile" style="--tile-accent:var(--accent)"><div class="tile-label">Open Risk Exposure</div><div class="tile-value mono">'+openExposure+'</div><div class="tile-sub">&Sigma; risk score, open risks</div></div>'+
      '<div class="tile" style="--tile-accent:var(--good)"><div class="tile-label">CAPA Closure Rate</div><div class="tile-value mono">'+closureRate+'%</div><div class="tile-sub">'+completed+' of '+actions.length+' actions completed</div></div>'+
      '<div class="tile" style="--tile-accent:var(--critical)"><div class="tile-label">Facilities w/ Critical Risk</div><div class="tile-value mono">'+facilitiesElevated+'</div><div class="tile-sub">of '+DATA.facilities.length+' facilities</div></div>'+
      '<div class="tile" style="--tile-accent:var(--warning)"><div class="tile-label">Total Incidents Logged</div><div class="tile-value mono">'+incs.length+'</div><div class="tile-sub">across reporting period</div></div>'+
    '</div>'+
    '<div class="cols-2" style="margin-top:16px">'+
      '<div class="card"><div class="card-head"><h3>Incidents by Hazard Category</h3><span class="card-head-sub">Top 10</span></div><div class="chartwrap">'+horizontalBarChart(catItems)+'</div></div>'+
      '<div class="card"><div class="card-head"><h3>Open Risk Level by Facility</h3></div><div class="chartwrap">'+groupedFacilityChart(facRows)+'</div></div>'+
    '</div>'+
    '<div class="cols-2" style="margin-top:16px">'+
      '<div class="card"><div class="card-head"><h3>Incident Severity Trend</h3><span class="card-head-sub">Last 12 months</span></div><div class="chartwrap">'+stackedMonthlyChart(buckets,['Low','Medium','High','Critical'],sevColors,{Low:'Low',Medium:'Medium',High:'High',Critical:'Critical'})+'</div></div>'+
      '<div class="card"><div class="card-head"><h3>Corrective Action Status</h3></div><div class="chartwrap">'+statusStackedBar(capaCounts,capaColors,['Completed','In Progress','Open','Overdue'])+'</div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><div class="card-head"><h3>Facility Scorecard</h3></div>'+
      '<div class="tablewrap scorecard-table" style="border:none;margin-top:10px"><table><thead><tr><th>Facility</th><th>Open Incidents</th><th>High/Critical Risks</th><th>Overdue Actions</th><th>Avg AI Confidence</th></tr></thead><tbody>'+scoreRows+'</tbody></table></div>'+
    '</div>'
  );
}

var FACILITY_COORDS = {

function signalBandForScore(score){
  if(score==null) return 'Low';
  if(score>=80) return 'Critical';
  if(score>=60) return 'High';
  if(score>=40) return 'Medium';
  return 'Low';
}
function facilityStats(facilityId){
  var incs = DATA.incidents.filter(function(i){ return i.facility_id===facilityId; });
  var open = incs.filter(function(i){ return i.status!=='Closed'; });
  var acts = DATA.correctiveActions.filter(function(a){ return a.facility_id===facilityId; });
  var openActs = acts.filter(function(a){ return a.status!=='Completed'; });
  var overdueActs = acts.filter(function(a){ return a.status==='Overdue'; });
  var risks = DATA.riskAssessments.filter(function(r){ return r.facility_id===facilityId; });
  var openHighRisks = risks.filter(function(r){ return r.status==='Open' && (r.risk_level==='High'||r.risk_level==='Critical'); });
  var summary = (execData().facilityComparison.facility_summaries||{})[facilityId] || {};
  var activeEmployees = DATA.employees.filter(function(e){ return e.facility_id===facilityId && e.is_active; }).length;
  return { incidents: incs.length, openIncidents: open.length, openActions: openActs.length,
    overdueActions: overdueActs.length, openHighRisks: openHighRisks.length,
    signalScore: summary.max_risk_signal_score || 0, topRisk: summary.fastest_increasing_risk,
    riskCount: summary.risk_count || 0, employees: activeEmployees };
}

    {d:'M120,300 Q180,280 220,320 Q210,370 160,390 Q110,360 120,300 Z', label:'South America'},
    {d:'M440,220 Q500,210 520,260 Q500,320 450,330 Q410,280 440,220 Z', label:'Africa'},

  for(var glat=-45; glat<=75; glat+=30){ var gy=proj(glat,0).y; gridSvg += '<line class="map-grid" x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'"></line>'; }

  var pins = facs.map(function(f){

  var mapSvg = '<div class="map-card">'+svgWrap(W,H, landSvg+gridSvg+pins)+

      ['Low','Medium','High','Critical'].map(function(b){ return '<span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:var(--'+severityTone(b)+');display:inline-block"></span>'+b+'</span>'; }).join('')+
    '</div></div>';

  var cards = facs.map(function(f){

      '<div class="fac-card-name">'+esc(f.name)+'</div><div class="fac-card-loc">'+esc(f.city)+', '+esc(f.country)+'</div>'+

      '<div class="fac-card-stats">'+
        '<div><div class="fac-card-stat-v">'+stats.employees+'</div><div class="fac-card-stat-k">Active Employees</div></div>'+

        '<div><div class="fac-card-stat-v">'+stats.overdueActions+'</div><div class="fac-card-stat-k">Overdue Actions</div></div>'+
        '<div><div class="fac-card-stat-v">'+stats.openHighRisks+'</div><div class="fac-card-stat-k">High/Critical Risks</div></div>'+

  }).join('');

  var detail = App.selectedFacilityId ? renderFacilityDetail(App.selectedFacilityId) : '';

  return mapSvg + '<div class="fac-card-grid">'+cards+'</div>' + detail;
}

function countBy(list, keyFn){
  var m = {};
  list.forEach(function(item){ var k = keyFn(item) || 'Unspecified'; m[k]=(m[k]||0)+1; });
  return m;
}
function chipRow(counts, limit){
  var keys = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
  if(limit) keys = keys.slice(0, limit);
  if(!keys.length) return '<span style="font-size:12px;color:var(--ink-3)">None on file.</span>';
  return keys.map(function(k){ return '<span class="chip">'+esc(k)+' <span class="chip-count">'+counts[k]+'</span></span>'; }).join('');
}
function subHead(title, hint){
  return '<h4 style="margin:18px 0 8px;font-size:12.5px">'+esc(title)+(hint?' <span style="font-weight:400;color:var(--ink-3)">('+esc(hint)+')</span>':'')+'</h4>';
}

function renderFacilityDetail(facilityId){
  var f = FAC[facilityId]; if(!f) return '';
  var stats = facilityStats(facilityId);
  var incsAll = DATA.incidents.filter(function(i){ return i.facility_id===facilityId; });
  var incs = incsAll.slice(0,8);
  var eq = DATA.equipment.filter(function(e){ return e.facility_id===facilityId; });
  var actsAll = DATA.correctiveActions.filter(function(a){ return a.facility_id===facilityId; });
  var acts = actsAll.filter(function(a){ return a.status!=='Completed'; }).slice(0,6);
  var employees = DATA.employees.filter(function(e){ return e.facility_id===facilityId; });
  var activeEmployees = employees.filter(function(e){ return e.is_active; });
  var hazardsHere = (DATA.hazards||[]).filter(function(h){ return h.facility_id===facilityId; });
  var hazIds = hazardsHere.map(function(h){ return h.hazard_id; });
  var controlsHere = DATA.controls.filter(function(c){ return hazIds.indexOf(c.hazard_id)>=0; });
  var sopsHere = DATA.sops.filter(function(s){ return s.facility_id===facilityId; });
  var inspectionsHere = (DATA.inspections||[]).filter(function(i){ return i.facility_id===facilityId; });
  var maintenanceHere = (DATA.maintenance||[]).filter(function(m){ return m.facility_id===facilityId; });
  var maintOverdue = maintenanceHere.filter(function(m){ return m.status==='Overdue'||m.status==='Delayed'; }).length;
  var inspDeficiencies = inspectionsHere.reduce(function(sum,i){ return sum + (i.deficiencies_found||0); }, 0);
  var hazardStatusCounts = countBy(hazardsHere, function(h){ return h.status; });

  // zones: derived from incidents.location free text, grouped -- exactly
  // the kind of real-but-unstructured field the exploration confirmed
  var zoneCounts = {};
  incsAll.forEach(function(i){
    var z = eqType(i.equipment_id) || i.hazard_category;
    zoneCounts[z] = (zoneCounts[z]||0)+1;
  });
  var zones = Object.keys(zoneCounts).sort(function(a,b){return zoneCounts[b]-zoneCounts[a];}).slice(0,6);

        '<div class="tile"><div class="tile-label">Established</div><div class="tile-value mono">'+(f.year_established||'&mdash;')+'</div></div>'+
        '<div class="tile"><div class="tile-label">Floor Area</div><div class="tile-value mono">'+(f.square_footage?f.square_footage.toLocaleString()+' sqft':'&mdash;')+'</div></div>'+

      '<div class="cols-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px">'+
        '<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
            '<h4 style="font-size:12.5px">Recent Incidents ('+incsAll.length+' total)</h4>'+

        '<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
            '<h4 style="font-size:12.5px">Open Corrective Actions ('+actsAll.filter(function(a){return a.status!=='Completed';}).length+' open)</h4>'+
            '<button class="btn btn-sm" data-action="goFacilityScoped" data-id="'+facilityId+'" data-route="actions">View all &rarr;</button></div>'+
          '<div class="tablewrap"><table><thead><tr><th>ID</th><th>Description</th><th>Status</th><th>Due</th></tr></thead><tbody>'+(actRows||'<tr><td colspan="4" style="text-align:center;color:var(--ink-3)">None</td></tr>')+'</tbody></table></div></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

/* =========================================================================
   VIEW: RISK GRAPH - a real, foreign-key-traced relationship diagram, not a
   decorative one. Every node below comes from an actual DATA.* row and
   every edge is a real FK: equipment -> maintenance/inspections/incidents
   -> hazards -> controls -> control assessments. Nothing here is invented;
   an equipment with no real connections simply shows a sparse graph.
   ========================================================================= */
function plainFieldRow(label, value){
  return '<div class="fact"><div class="fact-k">'+esc(label)+'</div><div class="fact-v">'+(value==null||value===''?'&mdash;':esc(value))+'</div></div>';
}
function riskGraphFor(equipmentId){
  var eq = EQ[equipmentId];
  if(!eq) return null;
  var maint = (DATA.maintenance||[]).filter(function(m){ return m.equipment_id===equipmentId; });
  var insp = (DATA.inspections||[]).filter(function(i){ return i.equipment_id===equipmentId; });
  var incidents = DATA.incidents.filter(function(i){ return i.equipment_id===equipmentId; });
  var hazards = (DATA.hazards||[]).filter(function(h){ return h.equipment_id===equipmentId; });
  var hazIds = hazards.map(function(h){ return h.hazard_id; });
  var controls = DATA.controls.filter(function(c){ return hazIds.indexOf(c.hazard_id)>=0; });
  var ctlIds = controls.map(function(c){ return c.control_id; });
  var assessments = (DATA.controlAssessments||[]).filter(function(a){ return ctlIds.indexOf(a.control_id)>=0; });
  var latestByControl = {};
  assessments.forEach(function(a){
    var cur = latestByControl[a.control_id];
    if(!cur || a.assessment_date > cur.assessment_date) latestByControl[a.control_id] = a;
  });
  var ineffective = Object.values(latestByControl).filter(function(a){ return a.effectiveness_rating!=='Effective'; }).length;
  var signalBand = (ineffective>=2 || incidents.length>=6) ? 'Critical' : (ineffective>=1 || incidents.length>=3) ? 'High' : incidents.length>=1 ? 'Medium' : 'Low';
  return { equipment:eq, maintenance:maint, inspections:insp, incidents:incidents, hazards:hazards, controls:controls,
    assessments:assessments, latestByControl:latestByControl, signalBand:signalBand };
}

/* Glow filters for the Risk Graph -- tinted feFlood clipped to the node's
   own silhouette (feComposite "in"), blurred, merged under the original --
   a color-matched halo rather than a generic white glow. Defined once,
   reused via url(#glow-{tone}); tone names match severityTone()'s output. */
var GRAPH_GLOW_DEFS = '<defs>' + ['good','warning','serious','critical','accent'].map(function(tone){
  return '<filter id="glow-'+tone+'" x="-60%" y="-60%" width="220%" height="220%">'+
    '<feFlood flood-color="var(--'+tone+')" result="color"/>'+
    '<feComposite in="color" in2="SourceGraphic" operator="in" result="tinted"/>'+
    '<feGaussianBlur in="tinted" stdDeviation="3" result="blur"/>'+
    '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'+
  '</filter>';
}).join('') + '</defs>';

function graphNode(x, y, w, h, label, sub, type, id, anchor, tone){
  var sel = App.riskGraphSelectedNode && App.riskGraphSelectedNode.type===type && App.riskGraphSelectedNode.id===id;
  var cls = 'graph-node-box'+(anchor?' anchor':'')+(sel&&!anchor?' selected':'');
  var strokeOverride = tone ? ' style="stroke:var(--'+tone+')"' : '';
  var glowTone = (sel && !anchor) ? 'accent' : ((tone==='critical'||tone==='serious') ? tone : null);
  var glowAttr = glowTone ? ' filter="url(#glow-'+glowTone+')" data-tone="'+glowTone+'"' : '';
  return '<g data-action="graphSelectNode" data-type="'+type+'" data-id="'+esc(id)+'" transform="translate('+x+','+y+')">'+
    '<rect class="'+cls+'" width="'+w+'" height="'+h+'" rx="7"'+strokeOverride+glowAttr+'></rect>'+
    '<text class="graph-node-label" x="10" y="'+(h/2 - (sub?4:-3))+'">'+esc(truncate(label,22))+'</text>'+
    (sub ? '<text class="graph-node-sub" x="10" y="'+(h/2+10)+'">'+esc(truncate(sub,26))+'</text>' : '')+
  '</g>';
}

function renderRiskGraph(){
  var eqOptions = DATA.equipment.filter(function(e){ return inScope(e.facility_id); })
    .sort(function(a,b){ return a.equipment_id<b.equipment_id?-1:1; });
  if(!App.riskGraphEquipmentId || !eqOptions.some(function(e){return e.equipment_id===App.riskGraphEquipmentId;})){
    // default to the equipment with the richest real connections, so the
    // first view of this screen is never sparse/empty by accident
    var best = null, bestScore = -1;
    eqOptions.forEach(function(e){
      var score = DATA.incidents.filter(function(i){return i.equipment_id===e.equipment_id;}).length +
                  (DATA.hazards||[]).filter(function(h){return h.equipment_id===e.equipment_id;}).length;
      if(score>bestScore){ bestScore=score; best=e; }
    });
    App.riskGraphEquipmentId = best ? best.equipment_id : (eqOptions[0]||{}).equipment_id;
  }
  var g = riskGraphFor(App.riskGraphEquipmentId);
  var eqOpts = eqOptions.map(function(e){
    return '<option value="'+e.equipment_id+'"'+(e.equipment_id===App.riskGraphEquipmentId?' selected':'')+'>'+
      e.equipment_id+' &mdash; '+esc(e.equipment_type)+' ('+esc(facShort(e.facility_id))+')</option>';
  }).join('');

  var picker = '<div class="filterbar"><div class="field" style="min-width:340px"><label>Equipment</label>'+
    '<select id="riskGraphEquip">'+eqOpts+'</select></div></div>';

  if(!g){ return picker + '<div class="empty-state">No equipment in scope.</div>'; }

  var COL_X = [20, 220, 440, 660, 880, 1080];
  var NODE_W = 170, NODE_H = 40, GAP = 10, MAX_SHOWN = 6;
  var colTitles = ['Equipment', 'Maintenance & Inspections', 'Incidents', 'Hazards', 'Controls', 'Risk Signal'];

  function layColumn(items, colIdx, mapFn){
    var shown = items.slice(0, MAX_SHOWN);
    var svg = '';
    shown.forEach(function(item, i){
      var y = 30 + i*(NODE_H+GAP);
      var n = mapFn(item);
      svg += graphNode(COL_X[colIdx], y, colIdx===2?190:NODE_W, NODE_H, n.label, n.sub, n.type, n.id, false, n.tone);
    });
    if(items.length>MAX_SHOWN){
      svg += '<text class="graph-more-label" x="'+COL_X[colIdx]+'" y="'+(30+MAX_SHOWN*(NODE_H+GAP)+8)+'">+'+(items.length-MAX_SHOWN)+' more</text>';
    }
    return svg;
  }

  var maintInsp = g.maintenance.map(function(m){ return {kind:'maint', row:m}; })
    .concat(g.inspections.map(function(i){ return {kind:'insp', row:i}; }));

  var svgBody = '';
  // column headers
  colTitles.forEach(function(t,i){ svgBody += '<text class="graph-col-label" x="'+COL_X[i]+'" y="14">'+t.toUpperCase()+'</text>'; });

  // Equipment (anchor)
  svgBody += graphNode(COL_X[0], 30, NODE_W, NODE_H, g.equipment.equipment_id, truncate(g.equipment.equipment_type,20), 'equipment', g.equipment.equipment_id, true);

  // Maintenance + Inspections
  svgBody += layColumn(maintInsp, 1, function(item){
    if(item.kind==='maint') return {label:item.row.maintenance_record_id, sub:item.row.status, type:'maintenance', id:item.row.maintenance_record_id, tone:item.row.status==='Delayed'||item.row.status==='Overdue'?'warning':null};
    return {label:item.row.inspection_id, sub:item.row.deficiencies_found+' deficiency(ies)', type:'inspection', id:item.row.inspection_id, tone:item.row.deficiencies_found>0?'warning':null};
  });

  // Incidents
  svgBody += layColumn(g.incidents, 2, function(i){
    return {label:i.incident_id+' — '+truncate(i.hazard_category,20), sub:i.severity_reported+' · '+fmtDateShort(i.date_occurred), type:'incident', id:i.incident_id, tone:severityTone(i.severity_reported)};
  });

  // Hazards
  svgBody += layColumn(g.hazards, 3, function(h){
    return {label:h.hazard_category, sub:h.status, type:'hazard', id:h.hazard_id, tone:null};
  });

  // Controls
  svgBody += layColumn(g.controls, 4, function(c){
    var latest = g.latestByControl[c.control_id];
    var rating = latest ? latest.effectiveness_rating : 'Not Assessed';
    return {label:c.control_name, sub:rating, type:'control', id:c.control_id, tone:rating==='Effective'?'good':(rating==='Ineffective'?'critical':'warning')};
  });

  // Risk Signal (summary)
  svgBody += graphNode(COL_X[5], 30, 150, NODE_H, g.signalBand+' Signal', g.incidents.length+' incidents traced', 'signal', 'summary', false, severityTone(g.signalBand));

  // Edges: equipment -> maintInsp/incidents/hazards ; hazards -> controls ; controls -> signal
  // "Flowing" (animated dash, signal traveling toward the verdict) whenever
  // this equipment's overall traced signal is High/Critical -- reuses the
  // exact same severityTone() the terminal Risk Signal node already trusts,
  // no new signal computation.
  var globalFlowing = (g.signalBand==='High' || g.signalBand==='Critical');
  var edges = '';
  function edge(fromCol, fromI, fromN, toCol, toI, toN, fromH, toH, flowing){
    var x1 = COL_X[fromCol] + (fromCol===2?190:NODE_W), y1 = 30 + fromI*(NODE_H+GAP) + NODE_H/2;
    var x2 = COL_X[toCol], y2 = 30 + toI*(NODE_H+GAP) + (toCol===2?NODE_H:NODE_H)/2;
    var midX = (x1+x2)/2;
    var cls = 'graph-edge'+(flowing?' flowing':'');
    return '<path class="'+cls+'" d="M'+x1+' '+y1+' C '+midX+' '+y1+', '+midX+' '+y2+', '+x2+' '+y2+'"></path>';
  }
  maintInsp.slice(0,MAX_SHOWN).forEach(function(_,i){ edges += edge(0,0,1, 1,i,1, null,null, globalFlowing); });
  g.incidents.slice(0,MAX_SHOWN).forEach(function(inc,i){ edges += edge(0,0,1, 2,i,1, null,null, globalFlowing || severityTone(inc.severity_reported)==='critical'); });
  g.hazards.slice(0,MAX_SHOWN).forEach(function(_,i){ edges += edge(0,0,1, 3,i,1, null,null, globalFlowing); });
  g.controls.slice(0,MAX_SHOWN).forEach(function(c,i){
    var hIdx = g.hazards.slice(0,MAX_SHOWN).findIndex(function(h){return h.hazard_id===c.hazard_id;});
    if(hIdx>=0) edges += edge(3,hIdx,1, 4,i,1, null,null, globalFlowing);
  });
  g.controls.slice(0,MAX_SHOWN).forEach(function(c,i){
    var latest = g.latestByControl[c.control_id];
    var ineffective = latest && latest.effectiveness_rating==='Ineffective';
    edges += edge(4,i,1, 5,0,1, null,null, globalFlowing || ineffective);
  });

  var maxRows = Math.max(1, maintInsp.length, g.incidents.length, g.hazards.length, g.controls.length, MAX_SHOWN===0?0:Math.min(MAX_SHOWN, Math.max(maintInsp.length,g.incidents.length,g.hazards.length,g.controls.length)));
  var svgH = 30 + Math.min(MAX_SHOWN, Math.max(1,maxRows))*(NODE_H+GAP) + 40;

  var graphSvg = '<div class="graph-card">'+svgWrap(1260, svgH, GRAPH_GLOW_DEFS+edges+svgBody)+'</div>';

  var detail = renderRiskGraphDetail(g);

  return picker + graphSvg + detail;
}

function renderRiskGraphDetail(g){
  var sel = App.riskGraphSelectedNode;
  var title = 'Select a node above for details', body = '<div style="font-size:12px;color:var(--ink-3)">Click any box in the diagram to see its real record.</div>';
  if(sel){
    if(sel.type==='equipment'){
      var e = g.equipment;
      title = e.equipment_id+' — '+e.equipment_type;
      body = '<div class="factgrid">'+plainFieldRow('Manufacturer', e.manufacturer)+plainFieldRow('Model', e.model_number)+
        plainFieldRow('Facility', facName(e.facility_id))+plainFieldRow('Criticality', e.criticality)+
        plainFieldRow('Status', e.status)+plainFieldRow('Install Date', fmtDate(e.install_date))+'</div>';
    } else if(sel.type==='maintenance'){
      var m = g.maintenance.find(function(x){return x.maintenance_record_id===sel.id;});
      if(m){ title = m.maintenance_record_id+' — Maintenance Record'; body = '<div class="factgrid">'+
        plainFieldRow('Type', m.maintenance_type)+plainFieldRow('Status', m.status)+plainFieldRow('Scheduled', fmtDate(m.scheduled_date))+
        plainFieldRow('Actual', m.actual_date?fmtDate(m.actual_date):'Not yet performed')+plainFieldRow('Delay (days)', m.delay_days)+
        plainFieldRow('Description', m.description)+'</div>'; }
    } else if(sel.type==='inspection'){
      var ip = g.inspections.find(function(x){return x.inspection_id===sel.id;});
      if(ip){ title = ip.inspection_id+' — Inspection'; body = '<div class="factgrid">'+
        plainFieldRow('Type', ip.inspection_type)+plainFieldRow('Area', ip.area_location)+plainFieldRow('Date', fmtDate(ip.inspection_date))+
        plainFieldRow('Deficiencies Found', ip.deficiencies_found)+plainFieldRow('Findings', ip.findings_summary)+'</div>'; }
    } else if(sel.type==='incident'){
      var i = INC[sel.id];
      if(i){ title = i.incident_id+' — '+i.title; body = '<div class="factgrid">'+
        plainFieldRow('Category', i.hazard_category)+plainFieldRow('Severity', i.severity_reported)+plainFieldRow('Status', i.status)+
        plainFieldRow('Occurred', fmtDate(i.date_occurred))+plainFieldRow('Description', i.description)+'</div>'+
        '<button class="btn btn-sm" style="margin-top:10px" data-action="goInvestigation" data-id="'+i.incident_id+'">Open in Investigations &rarr;</button>'; }
    } else if(sel.type==='hazard'){
      var h = HAZ[sel.id];
      if(h){ title = h.hazard_id+' — '+h.hazard_category; body = '<div class="factgrid">'+
        plainFieldRow('Description', h.description)+plainFieldRow('Typical Consequence', h.typical_consequence)+
        plainFieldRow('Status', h.status)+plainFieldRow('Identified', fmtDate(h.identified_date))+'</div>'; }
    } else if(sel.type==='control'){
      var c = CTL[sel.id];
      var latest = g.latestByControl[sel.id];
      if(c){ title = c.control_id+' — '+c.control_name; body = '<div class="factgrid">'+
        plainFieldRow('Type', c.control_type)+
        plainFieldRow('Latest Effectiveness', latest?latest.effectiveness_rating:'Not yet assessed')+
        plainFieldRow('Latest Assessment Date', latest?fmtDate(latest.assessment_date):'—')+
        plainFieldRow('Latest Findings', latest?latest.findings:'—')+'</div>'; }
    } else if(sel.type==='signal'){
      title = g.signalBand+' Risk Signal — Summary';
      body = '<div class="evidence-text">Derived from '+g.incidents.length+' traced incident(s) and '+
        Object.values(g.latestByControl).filter(function(a){return a.effectiveness_rating!=='Effective';}).length+
        ' control(s) not currently rated Effective on this equipment. This is a computed summary of the chain above, not a separate AI claim.</div>';
    }
  }
  return '<div class="card card-pad" style="margin-top:14px"><h3 style="margin-bottom:10px">'+esc(title)+'</h3>'+body+'</div>';
}

/* =========================================================================
   VIEW: REPORTS - print/export-friendly summaries assembled entirely from
   data already live in this session (DATA.*), scoped to the current
   facility filter exactly like every other screen. No new backend
   endpoint: these are the same numbers Overview/Command Center/Risk
   Register already compute, just laid out for printing or handoff.
   ========================================================================= */
function renderReports(){
  var facs = scopedFacilities();
  var incs = DATA.incidents.filter(function(i){ return inScope(i.facility_id); });
  var acts = DATA.correctiveActions.filter(function(a){ return inScope(a.facility_id); });
  var risks = DATA.riskAssessments.filter(function(r){ return inScope(r.facility_id); });
  var openIncs = incs.filter(function(i){ return i.status!=='Closed'; });
  var overdueActs = acts.filter(function(a){ return a.status==='Overdue'; });
  var openHighRisks = risks.filter(function(r){ return r.status==='Open' && (r.risk_level==='High'||r.risk_level==='Critical'); });
  var scopeLabel = App.facilityScope==='ALL' ? 'All Facilities' : facName(App.facilityScope);

  function reportCard(title, sub, rows, cols){
    var head = '<tr>'+cols.map(function(c){return '<th>'+c.label+'</th>';}).join('')+'</tr>';
    var body = rows.length ? rows.map(function(r){
      return '<tr>'+cols.map(function(c){ return '<td>'+c.get(r)+'</td>'; }).join('')+'</tr>';
    }).join('') : '<tr><td colspan="'+cols.length+'" style="color:var(--ink-3);text-align:center;padding:16px">No records in this scope.</td></tr>';
    return '<div class="card" style="margin-bottom:16px">'+
      '<div class="card-head"><div><h3>'+title+'</h3><div class="card-head-sub">'+sub+'</div></div></div>'+
      '<div class="tablewrap" style="margin-top:10px"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '</div>';
  }

  return (
    '<div class="report-toolbar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">'+
      '<div style="font-size:12.5px;color:var(--ink-2)">Report scope: <b>'+esc(scopeLabel)+'</b> &middot; generated '+fmtDate('2026-09-03')+'</div>'+
      '<button class="btn btn-primary" data-action="printReports">'+ICONS.reports+' Print / Export</button>'+
    '</div>'+
    '<div class="tiles" style="margin-bottom:16px">'+
      '<div class="tile" style="--tile-accent:var(--accent)"><div class="tile-label">Facilities in scope</div><div class="tile-value mono">'+facs.length+'</div></div>'+
      '<div class="tile" style="--tile-accent:var(--warning)"><div class="tile-label">Open Incidents</div><div class="tile-value mono">'+openIncs.length+'</div></div>'+
      '<div class="tile" style="--tile-accent:var(--critical)"><div class="tile-label">Overdue Actions</div><div class="tile-value mono">'+overdueActs.length+'</div></div>'+
      '<div class="tile" style="--tile-accent:var(--serious)"><div class="tile-label">Open High/Critical Risks</div><div class="tile-value mono">'+openHighRisks.length+'</div></div>'+
    '</div>'+
    reportCard('Incident Summary Report', incs.length+' incidents in scope', incs.slice(0,25), [
      {label:'ID', get:function(i){return i.incident_id;}},
      {label:'Title', get:function(i){return esc(truncate(i.title,50));}},
      {label:'Facility', get:function(i){return esc(facShort(i.facility_id));}},
      {label:'Severity', get:function(i){return i.severity_reported;}},
      {label:'Status', get:function(i){return i.status;}},
      {label:'Occurred', get:function(i){return fmtDateShort(i.date_occurred);}}

function handleSignup(){
  var name = document.getElementById('su_name').value.trim();
  var occupation = document.getElementById('su_occupation').value;
  var post = document.getElementById('su_post').value;

  var reqErr = Validators.requiredFields({name:name, occupation:occupation, post:post}, ['name','occupation','post']);
  if(reqErr){ alert(reqErr); return; }

  function applyProfile(user){
    App.currentUser = user;
    setStoredUser(user);
    if(user.rbac_role && ROLES[user.rbac_role]){
      App.currentRole = user.rbac_role;
      var r = currentRole();
      if(r.scope==='facility' && App.facilityScope==='ALL'){ App.facilityScope = DATA.facilities[0].facility_id; }
      if(r.scope==='all'){ App.facilityScope = 'ALL'; }
    }
    logAudit({ action:'Profile signed up / updated', entity_type:'Session', entity_id:user.user_id||'N/A',
      previous_value:null, new_value:{name:user.name, occupation:user.occupation, post:user.post, rbac_role:user.rbac_role},
      reason:'Submitted via the RISKON signup page.', source:'Human-generated', approval_status:'N/A' });
    navigate('dashboard');
    render();
  }

  if(BACKEND_REACHABLE){
    fetch('/api/users/signup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name:name, occupation:occupation, post:post })
    }).then(function(resp){ return resp.json().then(function(body){ return {ok:resp.ok, body:body}; }); })
      .then(function(result){
        if(!result.ok){ throw new Error(result.body && result.body.message ? result.body.message : 'Signup failed.'); }
        applyProfile(result.body);
      })
      .catch(function(){
        // local-only fallback -- still a real, usable profile for this browser, just not saved server-side
        applyProfile({ user_id:null, name:name, occupation:occupation, post:post, rbac_role:occupationToRoleLocal(occupation) });
      });
  } else {
    applyProfile({ user_id:null, name:name, occupation:occupation, post:post, rbac_role:occupationToRoleLocal(occupation) });
  }
}

function occupationToRoleLocal(occupation){
  // Mirrors backend/routes/users.py's OCCUPATION_TO_RBAC_ROLE mapping, used
  // only when no backend is reachable to derive a sensible default role --
  // the backend's mapping is authoritative whenever it's reachable.
  return {'Plant Manager':'plant_manager','Safety Manager':'hse_manager','EHS Coordinator':'hse_manager',
    'Environmental Compliance Officer':'hse_manager','Executive':'executive'}[occupation] || 'employee';

function nextId(prefix, arr, field){
  var max=0; arr.forEach(function(r){ var n=parseInt(String(r[field]).split('-').pop(),10); if(n>max) max=n; });
  return prefix+'-'+String(max+1).padStart(4,'0');
}

function handleApproval(incidentId, decision){
  var incident = DATA.incidents.find(function(i){ return i.incident_id===incidentId; });
  if(!incident) return;

  var role = currentRole();
  var commentEl = document.getElementById('reviewComment');
  var comment = commentEl ? commentEl.value.trim() : '';

  // ---- GOVERNANCE GUARDRAIL: unauthorized status change is blocked, not
  // just hidden. A role without approval authority cannot flip an incident's
  // status even by firing this handler directly -- and the blocked attempt
  // is itself audit-logged, same as a real system would. ----
  if(!role.canApprove){
    logAudit({ action:'Unauthorized action attempted', entity_type:'Incident', entity_id:incidentId,
      previous_value:{status:incident.status}, new_value:null,
      reason:role.label+' role does not have approval authority; action blocked by client-side RBAC check.',
      source:'Human-generated', approval_status:'N/A' });
    alert('Your role ('+role.label+') does not have approval authority for AI recommendations.\nContact your HSE Manager or Plant Manager.');
    render();
    return;
  }

  // A live (backend-generated) analysis is reviewed against the REAL
  // backend endpoint (POST /api/incidents/:id/review), not the old
  // client-only logic below -- see handleLiveIncidentReview().
  var liveRecord = App.liveAnalyses[incidentId];
  if(liveRecord){
    handleLiveIncidentReview(incident, liveRecord, decision, comment);
    return;
  }

  var prevStatus = incident.status;
  incident.status = decision==='approved' ? 'Approved' : 'Rejected';

  logAudit({ action:'AI recommendation reviewed', entity_type:'Incident', entity_id:incidentId,
    previous_value:{status:prevStatus}, new_value:{status:incident.status},
    reason: comment || '(no reviewer comment provided)', source:'Human-generated',
    approval_status: decision==='approved' ? 'Approved' : 'Rejected' });

  if(decision==='approved'){
    if(incident.has_full_ai_pipeline){
      var pipeline = DATA.aiPipelines[incident.ai_pipeline_id];
      var s12 = pipeline.stage_12_risk_register_impact, s11 = pipeline.stage_11_recommended_actions;

      var likelihood = s12.likelihood.value, impact = s12.impact.value;
      var scoreErr = Validators.riskScore(likelihood, impact);
      if(scoreErr){
        logAudit({ action:'Risk register update blocked (validation failure)', entity_type:'Incident', entity_id:incidentId,
          previous_value:null, new_value:{likelihood:likelihood, impact:impact}, reason:scoreErr,
          source:'Human-generated', approval_status:'N/A' });
        alert('Data validation failed: '+scoreErr+'\nRisk register was not updated. See Audit Trail.');
        render();
        return;
      }

      var riskId = nextId('RISK', DATA.riskAssessments, 'risk_assessment_id');
      var dupErr = Validators.noDuplicateId(riskId, DATA.riskAssessments, 'risk_assessment_id');
      if(dupErr){ logAudit({ action:'Duplicate ID blocked', entity_type:'RiskAssessment', entity_id:riskId, reason:dupErr, source:'Human-generated', approval_status:'N/A' }); render(); return; }

      DATA.riskAssessments.push({
        risk_assessment_id: riskId, facility_id: incident.facility_id, hazard_category: s12.hazard_category,
        equipment_id: incident.equipment_id, source_incident_id: incident.incident_id, related_sop_id: incident.related_sop_id,
        likelihood: likelihood, impact: impact, risk_score: s12.risk_score.value,
        risk_level: s12.risk_level.value, existing_controls: 'See linked incident AI investigation.',
        recommended_controls: 'See recommended actions on linked incident.', assessed_by_employee_id: 'EMP-0002',
        assessment_date: '2026-09-03', status: 'Open'
      });
      logAudit({ action:'Risk register entry created', entity_type:'RiskAssessment', entity_id:riskId,
        previous_value:null, new_value:{hazard_category:s12.hazard_category, risk_level:s12.risk_level.value, risk_score:s12.risk_score.value},
        reason:'Derived from approved AI recommendation for '+incidentId+'.', source:'Human-generated', approval_status:'Approved' });

      s11.actions.forEach(function(a){
        var caId = nextId('CA', DATA.correctiveActions, 'corrective_action_id');
        var due = new Date('2026-09-03'); due.setDate(due.getDate()+a.suggested_timeframe_days);
        DATA.correctiveActions.push({
          corrective_action_id: caId, incident_id: incident.incident_id, risk_assessment_id: riskId,
          facility_id: incident.facility_id, equipment_id: incident.equipment_id, action_type: a.action_type,
          description: a.description, owner_employee_id: pickOwnerForRole(incident.facility_id, a.suggested_owner_role),
          created_date: '2026-09-03', due_date: due.toISOString().slice(0,10), status: 'Open', completion_date: '',
          verification_method: 'Follow-up inspection'
        });
        logAudit({ action:'Corrective action assigned', entity_type:'Action', entity_id:caId,
          previous_value:null, new_value:{owner:pickOwnerForRole(incident.facility_id, a.suggested_owner_role), due_date:due.toISOString().slice(0,10), status:'Open'},
          reason:a.description, source:'Human-generated', approval_status:'N/A' });
      });
    } else {
      // no AI pipeline ran on this incident (severity_ai/ai_root_cause are null) - base the
      // register entry on the human-reported severity instead, never on an absent AI field.
      var sevBasis = incident.severity_reported;
      var impactVal = {Low:2,Medium:3,High:4,Critical:5}[sevBasis]||3;
      var scoreErr2 = Validators.riskScore(3, impactVal);
      if(scoreErr2){
        logAudit({ action:'Risk register update blocked (validation failure)', entity_type:'Incident', entity_id:incidentId, reason:scoreErr2, source:'Human-generated', approval_status:'N/A' });
        alert('Data validation failed: '+scoreErr2); render(); return;
      }
      var riskId2 = nextId('RISK', DATA.riskAssessments, 'risk_assessment_id');
      DATA.riskAssessments.push({
        risk_assessment_id: riskId2, facility_id: incident.facility_id, hazard_category: incident.hazard_category,
        equipment_id: incident.equipment_id, source_incident_id: incident.incident_id, related_sop_id: incident.related_sop_id,
        likelihood: 3, impact: impactVal, risk_score: 3*impactVal,
        risk_level: sevBasis, existing_controls: 'Per facility SOP.',
        recommended_controls: 'Manager-defined corrective action based on incident review (no AI analysis was generated for this incident).',
        assessed_by_employee_id: 'EMP-0002', assessment_date: '2026-09-03', status: 'Open'
      });
      logAudit({ action:'Risk register entry created', entity_type:'RiskAssessment', entity_id:riskId2,
        previous_value:null, new_value:{hazard_category:incident.hazard_category, risk_level:sevBasis},
        reason:'Derived from human-reviewed incident '+incidentId+' (no AI analysis was available).',
        source:'Human-generated', approval_status:'Approved' });
    }
  }
}

      App.aiAnalysisLoading = null;
      if(!result.ok){
        alert('AI analysis failed: '+(result.body && result.body.message ? result.body.message : 'Unknown error.'));
        render();
        return;
      }
      App.liveAnalyses[incidentId] = result.body;
      logAudit({ action:'Live AI analysis generated', entity_type:'Incident', entity_id:incidentId,
        previous_value:null, new_value:{analysis_id:result.body.analysis_id, confidence:result.body.analysis.confidence},
        reason:'Generated via POST /api/incidents/'+incidentId+'/analyze ('+result.body.model+').',
        source:'AI-generated', approval_status:'Pending' });
      render();
    })
    .catch(function(){
      App.aiAnalysisLoading = null;
      alert('Could not reach the backend to run AI analysis. Is it running? See README.md for setup.');

    });

function handleLiveIncidentReview(incident, liveRecord, decision, comment){
  var prevStatus = incident.status;
  var apiDecision = decision==='approved' ? 'Approved' : 'Rejected';
  fetch('/api/incidents/'+incident.incident_id+'/review', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({decision: apiDecision, comment: comment || null})
  })
    .then(function(resp){ return resp.json().then(function(body){ return {ok:resp.ok, body:body}; }); })
    .then(function(result){
      if(!result.ok){ throw new Error(result.body && result.body.message ? result.body.message : 'Review failed.'); }
      incident.status = apiDecision;
      liveRecord.human_review_status = apiDecision;
      logAudit({ action:'AI recommendation reviewed (live)', entity_type:'Incident', entity_id:incident.incident_id,
        previous_value:{status:prevStatus}, new_value:{status:apiDecision},
        reason: comment || '(no reviewer comment provided)', source:'Human-generated', approval_status: apiDecision });
      if(result.body.actions_created && result.body.actions_created.length){
        logAudit({ action:'Corrective action(s) created (live)', entity_type:'Incident', entity_id:incident.incident_id,
          previous_value:null, new_value:{action_ids:result.body.actions_created},
          reason:'Derived from approved live AI analysis; created in the real database -- reload to see them '+
                 'on the Corrective Actions screen.', source:'Human-generated', approval_status:'N/A' });
      }
      render();
    })
    .catch(function(err){
      alert('Could not save the review decision: '+err.message+'\nThe backend may be unreachable.');
      render();
    });
}
